<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Comparador | Future Radar FC</title><style>body{margin:0;background:#080d0b;color:#f2f7f3;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:28px}a{color:#b7f36b;text-decoration:none}.panel,table{background:#101915;border:1px solid #293a30;border-radius:12px;padding:16px}table{width:100%;border-collapse:collapse}td,th{padding:13px;border-bottom:1px solid #293a30;text-align:left}th{color:#b7f36b}.muted{color:#9aaa9f;font-size:12px}button{background:#b7f36b;border:0;padding:11px 15px;border-radius:7px;font-weight:bold;cursor:pointer;margin:15px 8px 0 0}</style></head><body><div class="wrap"><p><a href="/">FUTURE RADAR FC</a> / <a href="/players/">Jugadores</a></p><h1>Comparador de jugadores</h1><p class="muted">Comparación lado a lado de hasta tres perfiles. Solo se muestran datos disponibles.</p><div id="result" class="panel">Cargando…</div><button id="clear">Limpiar comparación</button> <a href="/scouting/">Mi seguimiento de scouting</a></div><script>const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g),id=p=>slug(p.name)+'-'+String(p.dateOfBirth||'').replace(/[^0-9]/g,'');fetch('/future-radar-players.json').then(r=>r.json()).then(players=>{const ids=JSON.parse(localStorage.getItem('frComparePlayers')||'[]');const chosen=ids.map(k=>players.find(p=>id(p)===k)).filter(Boolean);if(!chosen.length){document.getElementById('result').textContent='No hay jugadores seleccionados. Entra en una ficha y pulsa Añadir a comparación.';return}const rows=[['Edad',p=>p.age&&p.age+' años'],['Posición',p=>p.position],['Club',p=>p.club],['Nacionalidad',p=>p.nationality],['Altura',p=>p.heightCm&&p.heightCm+' cm'],['Partidos UEFA Youth League',p=>p.youthLeagueStats?.matchesPlayed],['Minutos',p=>p.youthLeagueStats?.minutesPlayed],['Goles',p=>p.youthLeagueStats?.goals],['Asistencias',p=>p.youthLeagueStats?.assists]];document.getElementById('result').innerHTML='<div style="overflow:auto"><table><tr><th>Indicador</th>'+chosen.map(p=>'<th><a href="/players/'+id(p)+'/">'+p.name+'</a></th>').join('')+'</tr>'+rows.map(([n,get])=>'<tr><th>'+n+'</th>'+chosen.map(p=>'<td>'+(get(p)??'—')+'</td>').join('')+'</tr>').join('')+'</table></div><p class="muted">— significa que el dato no está disponible. No se generan puntuaciones comparativas artificiales.</p>'});document.getElementById('clear').onclick=()=>{localStorage.removeItem('frComparePlayers');location.reload()};</script></body></html>
