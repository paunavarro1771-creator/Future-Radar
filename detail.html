const $=id=>document.getElementById(id), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), slug=v=>String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''), path=location.pathname.split('/').filter(Boolean), kind=path[0], key=decodeURIComponent(path.slice(1).join('/'));
const flag=code=>{const c=String(code||'').toUpperCase();return /^[A-Z]{3}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'🌍'};
const crest=name=>'https://www.google.com/s2/favicons?domain='+encodeURIComponent(name)+'.com&sz=128';
function normalizeAcademyCrestName(v){return String(v||'').replace(/\b(?:U\s?\d{1,2}|Under\s?\d{1,2})\b/ig,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(football club|soccer club|club de football|club de futbol|fc|f\.c\.|cf|c\.f\.|afc)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function academyCrestForms(v){const full=String(v||'').replace(/\b(?:U\s?\d{1,2}|Under\s?\d{1,2})\b/ig,'').trim();return [...new Set([full,full.replace(/^(?:FC|CF|AFC|SC|FK|SK|AS|US|RC|CA|CD|UD|RCD|AC|SV)\s+/i,'').trim(),full.replace(/\s+(?:FC|CF|AFC|FK|SK|AS|US|RC|CA|CD|UD|AC)$/i,'').trim()].filter(Boolean))}
async function findAcademyCrest(names){
 for(const name of names){
  try{
   const forms=academyCrestForms(name),targets=new Set(forms.map(normalizeAcademyCrestName)),hits=new Map();
   for(const query of forms){const r=await fetch('https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(query)+'&language=en&uselang=en&type=item&limit=12&format=json&origin=*');if(!r.ok)continue;(await r.json()).search?.forEach(x=>{if(x.id)hits.set(x.id,x)});}
   if(!hits.size)continue;
   const ids=[...hits.keys()],entities={};
   for(let i=0;i<ids.length;i+=40){const r=await fetch('https://www.wikidata.org/w/api.php?action=wbgetentities&ids='+encodeURIComponent(ids.slice(i,i+40).join('|'))+'&props=claims|labels|aliases&languages=en|es|fr|de|it|pt|nl|no|tr|da&format=json&origin=*');if(r.ok)Object.assign(entities,(await r.json()).entities||{});}
   const logos=[];
   for(const entity of Object.values(entities)){const namesFound=[];Object.values(entity.labels||{}).forEach(x=>namesFound.push(x.value));Object.values(entity.aliases||{}).forEach(list=>list.forEach(x=>namesFound.push(x.value)));if(!namesFound.some(x=>targets.has(normalizeAcademyCrestName(x))))continue;const c=entity.claims||{},logo=(c.P154||[]).find(x=>x.rank==='preferred')||(c.P154||[]).find(x=>x.rank!=='deprecated'),badge=(c.P94||[]).find(x=>x.rank==='preferred')||(c.P94||[]).find(x=>x.rank!=='deprecated'),file=logo?.mainsnak?.datavalue?.value||badge?.mainsnak?.datavalue?.value;if(file)logos.push({file,preferred:logo?.rank==='preferred'||badge?.rank==='preferred'});}
   logos.sort((a,b)=>Number(b.preferred)-Number(a.preferred));if(logos.length)return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(logos[0].file)+'?width=180';
  }catch(e){}
 }
 return null;
}
function stats(p){return p.youthLeagueStats||{}}
function displayClubName(value){return String(value||'Club no disponible').replace(/\b(?:U\s?-?\s?\d{1,2}|Under\s?\d{1,2})\b/ig,'').replace(/\s+(?:FC|F\.C\.|CF|C\.F\.|AFC)$/i,'').replace(/[\s·,|/-]+$/g,'').replace(/\s{2,}/g,' ').trim()||'Club no disponible'}
function academyCategory(club){const m=String(club||'').match(/\b(?:U\s?-?\s?(\d{1,2})|Under\s?(\d{1,2}))\b/i);return m?'U'+(m[1]||m[2]):'Sin categoría indicada'}
function academyGroupKey(club){return String(club||'').replace(/\b(?:U\s?\d{1,2}|Under\s?\d{1,2})\b/ig,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(football club|soccer club|fc|f\.c\.|cf|c\.f\.|afc)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function buildAcademyGroups(players){const groups=new Map();players.forEach(p=>{const club=p.club||'Club no disponible',key=academyGroupKey(club);if(!groups.has(key))groups.set(key,{key,name:displayClubName(club),variants:new Map(),players:[]});const g=groups.get(key);if(!g.variants.has(club))g.variants.set(club,[]);g.variants.get(club).push(p);g.players.push(p);const candidate=displayClubName(club);if(candidate.length<g.name.length)g.name=candidate;});return [...groups.values()]}
function renderAcademySquad(group,category){const selected=category==='ALL'?group.players:group.players.filter(p=>academyCategory(p.club)===category);$('academySquad').innerHTML=selected.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(p=>'<a class="rowitem" href="/players/'+slug(p.name)+'-'+String(p.dateOfBirth||'').replace(/[^0-9]/g,'')+'/"><span><strong>'+esc(p.name)+'</strong><span class="muted">'+esc(p.position)+' · '+esc(p.nationality)+'</span></span><span class="tag">'+esc(p.age??'—')+' años ↗</span></a>').join('')||'<div class="notice">No hay jugadores registrados en esta categoría.</div>';document.querySelectorAll('[data-academy-category]').forEach(b=>b.classList.toggle('active',b.dataset.academyCategory===category));}
function stat(label,value){return '<div class="stat"><small>'+esc(label)+'</small><strong>'+esc(value??'—')+'</strong></div>'}
async function load(){
 const [players,matches,worldCup]=await Promise.all([fetch('/future-radar-players.json').then(r=>r.json()),fetch('/uefa-youth-league-2026-27.json').then(r=>r.json()).then(x=>x.matches),fetch('/u17-world-cup-2026.json').then(r=>r.json())]);
 if(kind==='players'){const p=players.find(x=>slug(x.name)+'-'+String(x.dateOfBirth||'').replace(/[^0-9]/g,'')===key);if(!p)return missing('No encontramos ese perfil en la base de datos.');$('crumbType').textContent='Jugadores / '+p.name;const s=stats(p);$('content').innerHTML='<section class="hero"><div class="flag">'+flag(p.nationality)+'</div><div><div class="eyebrow">Player scouting profile · '+esc(p.season||'2026/27')+'</div><h1>'+esc(p.name)+'</h1><div class="sub">'+esc(displayClubName(p.club))+(academyCategory(p.club)!=='Sin categoría indicada'?' · '+esc(academyCategory(p.club)):'')+' · '+esc(p.clubCountry)+'</div></div></section><div class="grid">'+stat('Edad',p.age?p.age+' años':'—')+stat('Posición',p.position)+stat('Nacionalidad',p.nationality)+stat('Altura',p.heightCm?p.heightCm+' cm':'—')+stat('Fecha de nacimiento',p.dateOfBirth)+stat('Temporada',p.season)+'</div><section class="panel"><h2>Rendimiento competitivo</h2>'+(s.competition?'<div class="grid">'+stat('Competición',s.competition)+stat('Partidos',s.matchesPlayed)+stat('Minutos',s.minutesPlayed)+stat('Goles',s.goals)+stat('Asistencias',s.assists)+'</div><p class="muted">Fuente: '+esc(s.source||'No especificada')+' · Actualización: '+esc(s.lastUpdated||'—')+'</p>':'<div class="notice">Todavía no hay estadísticas competitivas verificadas asociadas a este jugador. No mostramos cifras estimadas.</div>')+'</section><section class="panel"><h2>Club actual</h2><p>'+esc(displayClubName(p.club))+(academyCategory(p.club)!=='Sin categoría indicada'?' · '+esc(academyCategory(p.club)):'')+' · '+esc(p.clubCountry)+'</p><a class="btn" href="/academies/'+slug(displayClubName(p.club))+'/">Ver cantera ↗</a></section>'+renderScoutTools(p)+'';wireScoutTools(p,players);}
 else if(kind==='academies'){
  const group=buildAcademyGroups(players).find(g=>slug(g.name)===key||[...g.variants.keys()].some(v=>slug(v)===key));

  const average=(group.players.reduce((n,p)=>n+(Number(p.age)||0),0)/Math.max(group.players.filter(p=>p.age!==null&&p.age!==undefined).length,1)).toFixed(1);
  $('crumbType').textContent='Canteras / '+group.name;
  $('content').innerHTML='<section class="hero"><img class="crest" src="'+crest(group.name)+'" alt="Escudo de '+esc(group.name)+'"><div><div class="eyebrow">Academy profile</div><h1>'+esc(group.name)+'</h1><div class="sub">'+esc(group.players[0]?.clubCountry||'')+' · Plantillas registradas en Future Radar</div></div></section><div class="grid">'+stat('Jugadores registrados',group.players.length)+stat('Edad media',average+' años')+stat('Plantillas / categorías',categories.length)+'</div><section class="panel"><h2>Plantillas de la cantera</h2><p class="muted">Los equipos del mismo club están agrupados aquí. Selecciona una categoría para consultar sus jugadores.</p><div id="academyCategoryTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">'+ '<button class="btn" data-academy-category="ALL">Todas ('+group.players.length+')</button>'+categories.map(c=>'<button class="btn" data-academy-category="'+esc(c)+'">'+esc(c)+' ('+group.players.filter(p=>academyCategory(p.club)===c).length+')</button>').join('')+'</div><div class="rows" id="academySquad"></div></section>';
  document.querySelectorAll('[data-academy-category]').forEach(button=>button.addEventListener('click',()=>renderAcademySquad(group,button.dataset.academyCategory)));
  renderAcademySquad(group,'ALL');
  findAcademyCrest([group.name,...group.variants.keys()]).then(url=>{const image=document.querySelector('.hero .crest');if(url&&image)image.src=url});
 }
 else if(kind==='matches'){
  const m=matches.find(x=>slug(x.home)+'-'+slug(x.away)+'-'+x.date===key);
  if(m){
   $('crumbType').textContent='Partidos / UEFA Youth League';const ft=m.status==='FT';
   $('content').innerHTML='<section class="hero"><div style="flex:1;text-align:center"><div class="eyebrow">UEFA Youth League · Jornada '+m.matchday+'</div><h1>'+esc(m.home)+'</h1></div><div style="font:700 34px Space Grotesk;color:var(--green)">'+(ft?m.homeScore+' - '+m.awayScore:'VS')+'</div><div style="flex:1;text-align:center"><div class="eyebrow">'+esc(m.date)+'</div><h1>'+esc(m.away)+'</h1></div></section><div class="grid">'+stat('Fecha',m.date)+stat('Jornada',m.matchday)+stat('Estado',ft?'Finalizado':'Próximo')+stat('Competición','UEFA Youth League')+'</div><section class="panel"><h2>Estadísticas del partido</h2><div id="matchStats" class="notice">Consultando estadísticas verificadas…</div></section><section class="panel"><h2>Fuentes del encuentro</h2><a class="btn" href="'+esc(m.sofascoreUrl||'https://www.uefa.com/uefayouthleague/fixtures-results/')+'" target="_blank" rel="noopener">Consultar ficha externa ↗</a></section>';
   try{const q=new URLSearchParams({date:m.date,home:m.home,away:m.away});const r=await fetch('/api/youth-match-stats?'+q);const d=await r.json();$('matchStats').innerHTML=d.available?'<pre style="white-space:pre-wrap;color:#dce9de;font:12px DM Sans">'+esc(JSON.stringify(d.stats||d.data||d,null,2))+'</pre>':esc(d.message||'El proveedor no ha facilitado estadísticas para este encuentro.');}catch(e){$('matchStats').textContent='Estadísticas no disponibles. No se muestran datos inventados.'}
  }else{

   if(!wm)return missing('No encontramos ese partido en el calendario.');

   $('crumbType').textContent='Partidos / Mundial Sub-17';

   async function loadU17Details(){
    try{
     const q=new URLSearchParams({date:wm.date,home:wm.home,away:wm.away,details:'1'});

     const groups=data.statistics?.groups||[];

function scoutId(p){return slug(p.name)+'-'+String(p.dateOfBirth||'').replace(/[^0-9]/g,'')}
function renderScoutTools(p){return "<section class=\"panel\"><h2>Seguimiento de scouting</h2><div class=\"notice\">Notas y estado privados, guardados en este navegador.</div><label class=\"muted\" for=\"frStatus\">Estado</label><select id=\"frStatus\" style=\"display:block;width:100%;padding:12px;margin:8px 0;background:#101915;color:#f2f7f3;border:1px solid #293a30;border-radius:8px\"><option>Watchlist</option><option>En observación</option><option>Informe pendiente</option><option>Scouting prioritario</option><option>Descartado</option></select><textarea id=\"frNotes\" rows=\"4\" placeholder=\"Fortalezas, aspectos a mejorar, contexto y próximos pasos…\" style=\"display:block;width:100%;padding:12px;margin:8px 0;background:#101915;color:#f2f7f3;border:1px solid #293a30;border-radius:8px;font:14px DM Sans\"></textarea><button class=\"btn\" id=\"frSave\">Guardar seguimiento</button> <button class=\"btn\" id=\"frCompare\">Añadir a comparación</button><p class=\"muted\" id=\"frMessage\">Guardado localmente en este navegador.</p></section><section class=\"panel\"><h2>Historial de rendimiento</h2><div id=\"frHistory\" class=\"notice\"></div></section><section class=\"panel\"><h2>Jugadores de perfil similar</h2><div id=\"frSimilar\" class=\"rows\"></div></section>"}
function wireScoutTools(p,players){const id=scoutId(p),board=JSON.parse(localStorage.getItem('frScoutingBoard')||'{}'),saved=board[id]||{},status=document.getElementById('frStatus'),notes=document.getElementById('frNotes');status.value=saved.status||'Watchlist';notes.value=saved.notes||'';document.getElementById('frSave').onclick=()=>{board[id]={status:status.value,notes:notes.value,updatedAt:new Date().toISOString()};localStorage.setItem('frScoutingBoard',JSON.stringify(board));document.getElementById('frMessage').textContent='Seguimiento guardado.'};document.getElementById('frCompare').onclick=()=>{const ids=JSON.parse(localStorage.getItem('frComparePlayers')||'[]');if(!ids.includes(id))ids.push(id);localStorage.setItem('frComparePlayers',JSON.stringify(ids.slice(-3)));location.href='/compare/'};const hist=Array.isArray(p.performanceHistory)?p.performanceHistory:[];document.getElementById('frHistory').textContent=hist.length?hist.map(v=>v.season+': '+(v.matchesPlayed??'—')+' PJ, '+(v.goals??'—')+' G, '+(v.assists??'—')+' A').join(' | '):'No hay temporadas históricas verificadas para este jugador. No se inventan datos; consulta el rendimiento de la temporada actual más arriba.';const similar=players.filter(x=>x!==p&&x.position===p.position&&Math.abs(Number(x.age)-Number(p.age))<=2).slice(0,5);document.getElementById('frSimilar').innerHTML=similar.length?similar.map(x=>'<a class="rowitem" href="/players/'+scoutId(x)+'/"><strong>'+esc(x.name)+'</strong><span class="tag">'+esc(displayClubName(x.club))+(academyCategory(x.club)!=='Sin categoría indicada'?' · '+esc(academyCategory(x.club)):'')+' · '+esc(x.age)+' años</span></a>').join(''):'No hay suficientes perfiles equivalentes.'}
function missing(msg){$('content').innerHTML='<div class="error"><h1>Contenido no disponible</h1><p>'+esc(msg)+'</p><a class="btn" href="/">Volver al inicio</a></div>'}
load().catch(e=>{console.error(e);missing('No se ha podido cargar la información. Inténtalo de nuevo más tarde.')});
</script></body></html>
