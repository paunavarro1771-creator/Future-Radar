<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Future Radar FC · Scouting profile</title><meta name="description" content="Scouting intelligence, player profiles, academies and match centre."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#080d0b;--panel:#101915;--panel2:#17231b;--line:#293a30;--muted:#9aaa9f;--text:#f2f7f3;--green:#b7f36b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#080d0bf2;backdrop-filter:blur(14px);z-index:3}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:700 17px 'Space Grotesk';letter-spacing:1px}.brand b{color:var(--green)}nav{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#c1cec4}main{padding:34px 0 70px}.crumb{color:var(--muted);font-size:12px;margin-bottom:24px}.crumb a{color:var(--green)}.hero{background:linear-gradient(120deg,#17251b,#0d1510);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;align-items:center;gap:26px}.crest{width:100px;height:100px;object-fit:contain}.flag{font-size:24px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font:700 clamp(27px,5vw,42px) 'Space Grotesk';margin:8px 0}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0}.stat,.panel,.rowitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.stat small,.muted{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.stat strong{display:block;font:700 23px 'Space Grotesk';margin-top:7px}.panel{margin-top:18px}.panel h2{font:700 19px 'Space Grotesk';margin:0 0 14px}.rows{display:grid;gap:8px}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:14px}.rowitem strong{font-size:14px}.tag{color:var(--green);font-size:11px}.notice{padding:14px;background:#17251b;border-radius:10px;color:#c5d4c8;font-size:13px;line-height:1.6}.btn{display:inline-block;background:var(--green);color:#10180e;padding:10px 15px;border-radius:8px;font-weight:800;font-size:12px;margin-top:12px}.error{padding:40px;text-align:center;color:var(--muted)}@media(max-width:620px){.nav{height:auto;padding:16px 0;align-items:flex-start;flex-direction:column}nav{gap:12px}.hero{align-items:flex-start;flex-direction:column}.crest{width:76px;height:76px}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="/">FUTURE <b>RADAR</b> FC</a><nav><a href="/players/">Jugadores</a><a href="/academies/">Canteras</a><a href="/rankings/">Rankings</a><a href="/competitions/uefa-youth-league/">Competiciones</a><a href="/matches/">Partidos</a></nav></div></header><main class="wrap"><div class="crumb"><a href="/">Inicio</a> / <span id="crumbType">Scouting</span></div><div id="content"><div class="error">Cargando información contrastada…</div></div></main><script>
const $=id=>document.getElementById(id), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), slug=v=>String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''), path=location.pathname.split('/').filter(Boolean), kind=path[0], key=decodeURIComponent(path.slice(1).join('/'));
const flag=code=>{const c=String(code||'').toUpperCase();return /^[A-Z]{3}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'🌍'};
const crest=name=>'https://www.google.com/s2/favicons?domain='+encodeURIComponent(name)+'.com&sz=128';
function stats(p){return p.youthLeagueStats||{}}
function stat(label,value){return '<div class="stat"><small>'+esc(label)+'</small><strong>'+esc(value??'—')+'</strong></div>'}
async function load(){
 const [players,matches]=await Promise.all([fetch('/future-radar-players.json').then(r=>r.json()),fetch('/uefa-youth-league-2026-27.json').then(r=>r.json()).then(x=>x.matches)]);
 if(kind==='players'){const p=players.find(x=>slug(x.name)+'-'+String(x.dateOfBirth||'').replace(/[^0-9]/g,'')===key);if(!p)return missing('No encontramos ese perfil en la base de datos.');$('crumbType').textContent='Jugadores / '+p.name;const s=stats(p);$('content').innerHTML='<section class="hero"><div class="flag">'+flag(p.nationality)+'</div><div><div class="eyebrow">Player scouting profile · '+esc(p.season||'2026/27')+'</div><h1>'+esc(p.name)+'</h1><div class="sub">'+esc(p.club)+' · '+esc(p.clubCountry)+'</div></div></section><div class="grid">'+stat('Edad',p.age?p.age+' años':'—')+stat('Posición',p.position)+stat('Nacionalidad',p.nationality)+stat('Altura',p.heightCm?p.heightCm+' cm':'—')+stat('Fecha de nacimiento',p.dateOfBirth)+stat('Temporada',p.season)+'</div><section class="panel"><h2>Rendimiento competitivo</h2>'+(s.competition?'<div class="grid">'+stat('Competición',s.competition)+stat('Partidos',s.matchesPlayed)+stat('Minutos',s.minutesPlayed)+stat('Goles',s.goals)+stat('Asistencias',s.assists)+'</div><p class="muted">Fuente: '+esc(s.source||'No especificada')+' · Actualización: '+esc(s.lastUpdated||'—')+'</p>':'<div class="notice">Todavía no hay estadísticas competitivas verificadas asociadas a este jugador. No mostramos cifras estimadas.</div>')+'</section><section class="panel"><h2>Club actual</h2><p>'+esc(p.club)+' · '+esc(p.clubCountry)+'</p><a class="btn" href="/academies/'+slug(p.club)+'/">Ver cantera ↗</a></section>'+renderScoutTools(p)+'';}
 wireScoutTools(p,players);
 else if(kind==='academies'){const club=players.find(p=>slug(p.club)===key)?.club;if(!club)return missing('No encontramos esta cantera en la base de datos.');const squad=players.filter(p=>p.club===club).sort((a,b)=>(a.name||'').localeCompare(b.name||''));$('crumbType').textContent='Canteras / '+club;$('content').innerHTML='<section class="hero"><img class="crest" src="'+crest(club)+'" alt="Escudo orientativo de '+esc(club)+'"><div><div class="eyebrow">Academy profile</div><h1>'+esc(club)+'</h1><div class="sub">'+esc(squad[0]?.clubCountry||'')+' · Plantilla registrada en Future Radar</div></div></section><div class="grid">'+stat('Jugadores registrados',squad.length)+stat('Edad media', (squad.reduce((n,p)=>n+(Number(p.age)||0),0)/Math.max(squad.filter(p=>p.age).length,1)).toFixed(1)+' años')+stat('Temporada','2026/27')+'</div><section class="panel"><h2>Jugadores de la cantera</h2><div class="rows">'+squad.map(p=>'<a class="rowitem" href="/players/'+slug(p.name)+'-'+String(p.dateOfBirth||'').replace(/[^0-9]/g,'')+'/"><span><strong>'+esc(p.name)+'</strong><span class="muted">'+esc(p.position)+' · '+esc(p.nationality)+'</span></span><span class="tag">'+esc(p.age??'—')+' años ↗</span></a>').join('')+'</div></section>';}
 else if(kind==='matches'){const m=matches.find(x=>slug(x.home)+'-'+slug(x.away)+'-'+x.date===key);if(!m)return missing('No encontramos ese partido en el calendario.');$('crumbType').textContent='Partidos / UEFA Youth League';const ft=m.status==='FT';$('content').innerHTML='<section class="hero"><div style="flex:1;text-align:center"><div class="eyebrow">UEFA Youth League · Jornada '+m.matchday+'</div><h1>'+esc(m.home)+'</h1></div><div style="font:700 34px Space Grotesk;color:var(--green)">'+(ft?m.homeScore+' - '+m.awayScore:'VS')+'</div><div style="flex:1;text-align:center"><div class="eyebrow">'+esc(m.date)+'</div><h1>'+esc(m.away)+'</h1></div></section><div class="grid">'+stat('Fecha',m.date)+stat('Jornada',m.matchday)+stat('Estado',ft?'Finalizado':'Próximo')+stat('Competición','UEFA Youth League')+'</div><section class="panel"><h2>Estadísticas del partido</h2><div id="matchStats" class="notice">Consultando estadísticas verificadas…</div></section><section class="panel"><h2>Fuentes del encuentro</h2><a class="btn" href="'+esc(m.sofascoreUrl||'https://www.uefa.com/uefayouthleague/fixtures-results/')+'" target="_blank" rel="noopener">Consultar ficha externa ↗</a></section>';try{const q=new URLSearchParams({date:m.date,home:m.home,away:m.away});const r=await fetch('/api/youth-match-stats?'+q);const d=await r.json();$('matchStats').innerHTML=d.available?'<pre style="white-space:pre-wrap;color:#dce9de;font:12px DM Sans">'+esc(JSON.stringify(d.stats||d.data||d,null,2))+'</pre>':esc(d.message||'El proveedor no ha facilitado estadísticas para este encuentro.');}catch(e){$('matchStats').textContent='Estadísticas no disponibles. No se muestran datos inventados.'}}
 else missing('Tipo de página no reconocido.');
}
function scoutId(p){return slug(p.name)+'-'+String(p.dateOfBirth||'').replace(/[^0-9]/g,'')}
function renderScoutTools(p){return "<section class=\"panel\"><h2>Seguimiento de scouting</h2><div class=\"notice\">Notas y estado privados, guardados en este navegador.</div><label class=\"muted\" for=\"frStatus\">Estado</label><select id=\"frStatus\" style=\"display:block;width:100%;padding:12px;margin:8px 0;background:#101915;color:#f2f7f3;border:1px solid #293a30;border-radius:8px\"><option>Watchlist</option><option>En observación</option><option>Informe pendiente</option><option>Scouting prioritario</option><option>Descartado</option></select><textarea id=\"frNotes\" rows=\"4\" placeholder=\"Fortalezas, aspectos a mejorar, contexto y próximos pasos…\" style=\"display:block;width:100%;padding:12px;margin:8px 0;background:#101915;color:#f2f7f3;border:1px solid #293a30;border-radius:8px;font:14px DM Sans\"></textarea><button class=\"btn\" id=\"frSave\">Guardar seguimiento</button> <button class=\"btn\" id=\"frCompare\">Añadir a comparación</button><p class=\"muted\" id=\"frMessage\">Guardado localmente en este navegador.</p></section><section class=\"panel\"><h2>Historial de rendimiento</h2><div id=\"frHistory\" class=\"notice\"></div></section><section class=\"panel\"><h2>Jugadores de perfil similar</h2><div id=\"frSimilar\" class=\"rows\"></div></section>"}
function wireScoutTools(p,players){const id=scoutId(p),board=JSON.parse(localStorage.getItem('frScoutingBoard')||'{}'),saved=board[id]||{},status=document.getElementById('frStatus'),notes=document.getElementById('frNotes');status.value=saved.status||'Watchlist';notes.value=saved.notes||'';document.getElementById('frSave').onclick=()=>{board[id]={status:status.value,notes:notes.value,updatedAt:new Date().toISOString()};localStorage.setItem('frScoutingBoard',JSON.stringify(board));document.getElementById('frMessage').textContent='Seguimiento guardado.'};document.getElementById('frCompare').onclick=()=>{const ids=JSON.parse(localStorage.getItem('frComparePlayers')||'[]');if(!ids.includes(id))ids.push(id);localStorage.setItem('frComparePlayers',JSON.stringify(ids.slice(-3)));location.href='/compare/'};const hist=Array.isArray(p.performanceHistory)?p.performanceHistory:[];document.getElementById('frHistory').textContent=hist.length?hist.map(v=>v.season+': '+(v.matchesPlayed??'—')+' PJ, '+(v.goals??'—')+' G, '+(v.assists??'—')+' A').join(' | '):'No hay temporadas históricas verificadas para este jugador. No se inventan datos; consulta el rendimiento de la temporada actual más arriba.';const similar=players.filter(x=>x!==p&&x.position===p.position&&Math.abs(Number(x.age)-Number(p.age))<=2).slice(0,5);document.getElementById('frSimilar').innerHTML=similar.length?similar.map(x=>'<a class="rowitem" href="/players/'+scoutId(x)+'/"><strong>'+esc(x.name)+'</strong><span class="tag">'+esc(x.club)+' · '+esc(x.age)+' años</span></a>').join(''):'No hay suficientes perfiles equivalentes.'}
function missing(msg){$('content').innerHTML='<div class="error"><h1>Contenido no disponible</h1><p>'+esc(msg)+'</p><a class="btn" href="/">Volver al inicio</a></div>'}
load().catch(e=>{console.error(e);missing('No se ha podido cargar la información. Inténtalo de nuevo más tarde.')});
</script></body></html>
