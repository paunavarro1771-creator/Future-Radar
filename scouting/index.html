<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Mi scouting | Future Radar FC</title><style>body{margin:0;background:#080d0b;color:#f2f7f3;font:15px Arial}.wrap{max-width:950px;margin:auto;padding:28px}a{color:#b7f36b;text-decoration:none}.item{display:flex;justify-content:space-between;gap:14px;align-items:center;background:#101915;border:1px solid #293a30;border-radius:10px;padding:16px;margin:10px 0}.muted{color:#9aaa9f;font-size:12px}.tag{color:#b7f36b}</style></head><body><div class="wrap"><p><a href="/">FUTURE RADAR FC</a> / <a href="/players/">Jugadores</a></p><h1>Mi seguimiento de scouting</h1><p class="muted">Watchlist, estados y notas privadas guardadas en este navegador.</p><div id="list">Cargando…</div><p><a href="/compare/">Abrir comparador →</a></p></div><script>const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),id=p=>slug(p.name)+'-'+String(p.dateOfBirth||'').replace(/[^0-9]/g,'');Promise.all([fetch('/future-radar-players.json').then(r=>r.json()),Promise.resolve(JSON.parse(localStorage.getItem('frScoutingBoard')||'{}'))]).then(([players,board])=>{const entries=Object.entries(board).map(([key,v])=>({p:players.find(p=>id(p)===key),v})).filter(x=>x.p);document.getElementById('list').innerHTML=entries.length?entries.map(({p,v})=>'<a class="item" href="/players/'+id(p)+'/"><span><strong>'+p.name+'</strong><br><small class="muted">'+p.club+' · '+p.position+' · '+(v.notes||'Sin notas')+'</small></span><span class="tag">'+(v.status||'Watchlist')+' →</span></a>').join(''):'<div class="item">Todavía no tienes jugadores guardados. Abre una ficha y guarda su seguimiento.</div>'}).catch(()=>document.getElementById('list').textContent='No se ha podido cargar el seguimiento.');</script></body></html>
