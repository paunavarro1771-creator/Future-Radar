name: Import official FIFA U17 reports
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import-fifa-u17-reports.py'
      - '.github/workflows/import-fifa-u17-reports.yml'
  workflow_dispatch:
  schedule:
    - cron: '42 8,20 * * *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF importer
        run: python -m pip install requests beautifulsoup4 pymupdf
      - name: Import all currently published official FIFA reports
        run: python scripts/import-fifa-u17-reports.py
      - name: Commit only changed verified data
        run: |
          if git diff --quiet -- data/fifa-u17-2026-official-match-reports.json; then
            echo "No new official reports"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fifa-u17-2026-official-match-reports.json
          git commit -m "data: import published FIFA U17 match reports"
          git push
