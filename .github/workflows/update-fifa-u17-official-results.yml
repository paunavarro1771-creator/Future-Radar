name: Update FIFA official results
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: official-fifa-u17-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Fetch and validate published FIFA results
        run: python scripts/import-fifa-u17-official-results.py
      - name: Commit only verified changes
        run: |
          if git diff --quiet -- data/fifa-u17-2026-official-results.json; then
            echo "No new FIFA results"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fifa-u17-2026-official-results.json
          git commit -m "data: update official FIFA U17 scores"
          git push
