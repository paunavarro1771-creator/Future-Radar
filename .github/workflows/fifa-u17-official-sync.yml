name: FIFA U17 official report sync
on:
  workflow_dispatch:
    inputs:
      audit_all:
        description: 'Download and parse every published FIFA report'
        type: boolean
        default: false
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: fifa-u17-official-report-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Fetch and verify FIFA official reports
        run: python scripts/import_fifa_u17_reports.py ${{ inputs.audit_all && '--audit-all' || '' }}
      - name: Commit verified report updates
        run: |
          if git diff --quiet -- data/fifa-u17-2026-official-match-reports.json; then
            echo 'No new verified reports'
            exit 0
          fi
          git config user.name 'future-radar-sync[bot]'
          git config user.email 'future-radar-sync[bot]@users.noreply.github.com'
          git add data/fifa-u17-2026-official-match-reports.json
          git commit -m 'data: sync newly verified FIFA U17 reports'
          git push
