name: Archive U17 match data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: archive-u17-match-data
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate latest match data
        run: node scripts/archive-u17-data.js
      - name: Commit only when data changed
        run: |
          git add data/u17-2026-snapshot.json\n          if git diff --cached --quiet -- data/u17-2026-snapshot.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "future-radar-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/u17-2026-snapshot.json
          git commit -m "data: archive verified U17 provider snapshot"
          git push
